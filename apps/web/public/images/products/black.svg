<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradDark" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="60%" stop-color="#0F0F0F" />
      <stop offset="100%" stop-color="#060606" />
    </radialGradient>
    <linearGradient id="blackCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F1F1F" />
      <stop offset="40%" stop-color="#383838" />
      <stop offset="50%" stop-color="#4F4F4F" />
      <stop offset="70%" stop-color="#262626" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="blackBottleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="35%" stop-color="#141414" />
      <stop offset="70%" stop-color="#0B0B0B" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="darkBottleShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="800" fill="url(#bgGradDark)" />

  <!-- Pedestal Reflection -->
  <ellipse cx="300" cy="650" rx="200" ry="24" fill="#000000" opacity="0.4" />

  <!-- Perfume Flacon Group -->
  <g filter="url(#darkBottleShadow)">
    <!-- Sprayer Collar Gold Accent -->
    <rect x="270" y="270" width="60" height="25" rx="3" fill="#C6A15B" />

    <!-- Cap -->
    <rect x="250" y="195" width="100" height="75" rx="5" fill="url(#blackCap)" stroke="#333333" stroke-width="1" />
    <!-- Gold line on Cap -->
    <line x1="250" y1="232" x2="350" y2="232" stroke="#C6A15B" stroke-width="1.5" />

    <!-- Main Glass Body (Sleek Obsidian) -->
    <rect x="180" y="295" width="240" height="320" rx="16" fill="url(#blackBottleBody)" stroke="#262626" stroke-width="2" />

    <!-- Sleek Edges Highlight Reflection -->
    <path d="M 195 315 L 205 315 L 200 580 L 195 580 Z" fill="#FFFFFF" opacity="0.15" />
    <path d="M 395 315 L 405 315 L 400 580 L 395 580 Z" fill="#FFFFFF" opacity="0.08" />

    <!-- Label Plaque (Deep Matte Black with Gold Inset) -->
    <rect x="220" y="380" width="160" height="150" rx="4" fill="#0D0D0D" stroke="#C6A15B" stroke-width="1" />

    <!-- Brand Typography on Label -->
    <text x="300" y="420" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="600" letter-spacing="4" fill="#C6A15B" text-anchor="middle">UNSULID</text>
    <line x1="260" y1="432" x2="340" y2="432" stroke="#5B0F18" stroke-width="1.5" />
    <text x="300" y="468" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" font-weight="700" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">BLACK</text>
    <text x="300" y="492" font-family="'Manrope', sans-serif" font-size="9" font-weight="500" letter-spacing="2" fill="#8B8178" text-anchor="middle">EAU DE PARFUM</text>
    <text x="300" y="508" font-family="'Manrope', sans-serif" font-size="8" font-weight="400" letter-spacing="1.5" fill="#C6A15B" text-anchor="middle">PARTY &amp; NOCTURNAL</text>
  </g>

  <!-- Editorial Subtext Badge -->
  <text x="300" y="730" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#C6A15B" text-anchor="middle">NIGHT WEAR STATEMENT</text>
</svg>

