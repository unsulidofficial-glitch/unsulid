<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%">
  <defs>
    <radialGradient id="heroVelvet" cx="70%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#5B0F18" />
      <stop offset="40%" stop-color="#3A080E" />
      <stop offset="80%" stop-color="#1A0306" />
      <stop offset="100%" stop-color="#0B0B0B" />
    </radialGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DE" />
      <stop offset="40%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8A6726" />
    </linearGradient>
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Velvet Background with Atmospheric Light -->
  <rect width="1200" height="900" fill="url(#heroVelvet)" />

  <!-- Draped Velvet Fold Lines -->
  <path d="M 0 0 Q 400 300 300 900" stroke="#7D1A27" stroke-width="40" opacity="0.15" fill="none" />
  <path d="M 200 0 Q 600 400 500 900" stroke="#000000" stroke-width="60" opacity="0.3" fill="none" />
  <path d="M 800 0 Q 950 500 1200 600" stroke="#7D1A27" stroke-width="50" opacity="0.2" fill="none" />

  <!-- Marble Pedestal -->
  <polygon points="520,620 980,620 1060,780 440,780" fill="#171717" stroke="#262626" stroke-width="2" />
  <polygon points="440,780 1060,780 1040,820 460,820" fill="#0B0B0B" />

  <!-- Perfume Flacon 1: HIGH CLASS (Left) -->
  <g filter="url(#heroShadow)">
    <rect x="580" y="320" width="80" height="65" rx="4" fill="url(#goldSheen)" />
    <rect x="520" y="395" width="200" height="260" rx="14" fill="#FDFBF7" stroke="#C6A15B" stroke-width="2" opacity="0.95" />
    <rect x="550" y="440" width="140" height="150" rx="4" fill="#FFFFFF" stroke="#E6D9C9" stroke-width="1" />
    <text x="620" y="480" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="600" letter-spacing="3" fill="#5B0F18" text-anchor="middle">UNSULID</text>
    <text x="620" y="520" font-family="'Cormorant Garamond', Georgia, serif" font-size="19" font-weight="600" letter-spacing="2" fill="#0B0B0B" text-anchor="middle">HIGH CLASS</text>
    <text x="620" y="545" font-family="'Manrope', sans-serif" font-size="8" letter-spacing="1.5" fill="#8B8178" text-anchor="middle">DAYTIME SIGNATURE</text>
  </g>

  <!-- Perfume Flacon 2: BLACK (Right) -->
  <g filter="url(#heroShadow)">
    <rect x="820" y="300" width="80" height="65" rx="4" fill="#1C1C1C" stroke="#C6A15B" stroke-width="1.5" />
    <rect x="760" y="375" width="200" height="270" rx="14" fill="#0B0B0B" stroke="#333333" stroke-width="2" />
    <rect x="790" y="420" width="140" height="150" rx="4" fill="#141414" stroke="#C6A15B" stroke-width="1" />
    <text x="860" y="460" font-family="'Cormorant Garamond', Georgia, serif" font-size="12" font-weight="600" letter-spacing="3" fill="#C6A15B" text-anchor="middle">UNSULID</text>
    <text x="860" y="505" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">BLACK</text>
    <text x="860" y="530" font-family="'Manrope', sans-serif" font-size="8" letter-spacing="1.5" fill="#8B8178" text-anchor="middle">NOCTURNAL STATEMENT</text>
  </g>

  <!-- Jasmine Petal Accent -->
  <path d="M 480 650 C 490 620, 520 630, 510 655 C 500 680, 470 670, 480 650 Z" fill="#F8F1E7" opacity="0.8" />
  <path d="M 505 660 C 525 645, 545 665, 530 680 C 515 695, 495 675, 505 660 Z" fill="#F8F1E7" opacity="0.9" />
</svg>

