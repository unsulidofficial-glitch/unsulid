<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="storyBg" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#5B0F18" />
      <stop offset="35%" stop-color="#3A080E" />
      <stop offset="70%" stop-color="#190306" />
      <stop offset="100%" stop-color="#0B0B0B" />
    </radialGradient>
    <linearGradient id="goldAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="40%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#805B1B" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#storyBg)" />

  <!-- Velvet & Light Form lines -->
  <path d="M 0 200 Q 300 450 100 1000" stroke="#7D1A27" stroke-width="40" opacity="0.2" fill="none" />
  <path d="M 600 0 Q 750 600 500 1000" stroke="#000000" stroke-width="80" opacity="0.4" fill="none" />

  <!-- Marble Plinth -->
  <polygon points="200,750 600,750 680,860 120,860" fill="#141414" stroke="#262626" stroke-width="1.5" />
  <polygon points="120,860 680,860 660,890 140,890" fill="#0A0A0A" />

  <!-- Atmospheric Gold Light Reflection -->
  <circle cx="400" cy="520" r="160" fill="#C6A15B" opacity="0.1" filter="url(#softGlow)" />

  <!-- Central Architectural Flacon Silhouette -->
  <g>
    <rect x="360" y="380" width="80" height="60" rx="4" fill="url(#goldAccentGrad)" />
    <rect x="300" y="450" width="200" height="280" rx="14" fill="#0B0B0B" stroke="#C6A15B" stroke-width="1.5" opacity="0.95" />
    <!-- Label -->
    <rect x="330" y="510" width="140" height="150" rx="4" fill="#141414" stroke="#5B0F18" stroke-width="1" />
    <text x="400" y="560" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="600" letter-spacing="4" fill="#C6A15B" text-anchor="middle">UNSULID</text>
    <line x1="360" y1="575" x2="440" y2="575" stroke="#C6A15B" stroke-width="1" opacity="0.6" />
    <text x="400" y="620" font-family="'Cormorant Garamond', Georgia, serif" font-size="20" font-weight="600" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">FINE PARFUM</text>
  </g>
</svg>

