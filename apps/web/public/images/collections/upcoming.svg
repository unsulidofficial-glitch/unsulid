<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="vaultGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3A080E" />
      <stop offset="60%" stop-color="#1F0407" />
      <stop offset="100%" stop-color="#0B0B0B" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#vaultGrad)" />
  <!-- Geometric Vault Motif -->
