  <circle cx="300" cy="225" r="90" stroke="#C6A15B" stroke-width="1" fill="none" opacity="0.3" />
  <circle cx="300" cy="225" r="60" stroke="#E6D9C9" stroke-width="0.75" fill="none" opacity="0.2" />
  <text x="300" y="230" font-family="'Cormorant Garamond', Georgia, serif" font-size="14" font-weight="600" letter-spacing="4" fill="#C6A15B" text-anchor="middle">THE VAULT</text>
