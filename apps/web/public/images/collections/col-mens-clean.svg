<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <radialGradient id="mensBg" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#6B131E" />
      <stop offset="50%" stop-color="#460910" />
      <stop offset="100%" stop-color="#1A0306" />
    </radialGradient>
    <linearGradient id="flaconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CA97" />
      <stop offset="100%" stop-color="#8A6726" />
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#mensBg)" />
  <!-- Velvet fold shadows -->
  <path d="M-50,250 Q100,50 350,250" fill="none" stroke="#7D1A27" stroke-width="50" opacity="0.3" />
  <path d="M100,250 Q250,80 450,220" fill="none" stroke="#000000" stroke-width="40" opacity="0.4" />
  <!-- Minimalist Perfume Flacon on Right -->
  <g transform="translate(260, 50)" opacity="0.85">
    <rect x="25" y="10" width="30" height="25" rx="3" fill="url(#flaconGold)" />
    <rect x="0" y="38" width="80" height="110" rx="8" fill="#5B0F18" stroke="#E2CA97" stroke-width="1.5" />
    <rect x="15" y="55" width="50" height="60" rx="2" fill="#3D060C" stroke="#C6A15B" stroke-width="1" />
  </g>
</svg>

